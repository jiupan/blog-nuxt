services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # 如果不需要外部访问数据库，可以注释掉下面这行
    # ports:
    #   - "5432:5432"

  app:
    image: ${APP_IMAGE}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          (async () => {
            const signal = AbortSignal.timeout(4000);
            let response = await fetch('http://127.0.0.1:3000/api/health', { signal });
            if (response.status === 404) {
              response = await fetch('http://127.0.0.1:3000/api/settings', { signal });
              const body = await response.json();
              if (!response.ok || body.code !== 0 || !body.data) process.exit(1);
            } else if (!response.ok || (await response.json()).status !== 'ok') {
              process.exit(1);
            }
          })().catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    init: true
    ipc: host
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      NUXT_PUBLIC_SITE_URL: ${SITE_URL}
      NUXT_SITE_URL: ${SITE_URL}
      UPLOAD_DIR: /app/uploads
      KNOWLEDGE_FILE_DIR: /app/data/knowledge-files
    volumes:
      - uploads:/app/uploads
      - knowledge-files:/app/data/knowledge-files
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  postgres-data:
  uploads:
  knowledge-files:
